[project]
name = "atlas-analytics"
version = "0.1.0"
description = "Atlas — autonomous analytics team inside Claude Code"
requires-python = "==3.13.*"
dependencies = [
    # core (Phase 0-5, local CSV path)
    "duckdb>=1.1.0",
    "python-pptx>=1.0.0",
    "pyyaml>=6.0",
    "pandas>=2.2",
    "numpy>=2.0",
    "scipy>=1.13",
    "statsmodels>=0.14",
    "openpyxl>=3.1",
    "python-dotenv>=1.0",
    "sqlglot>=25.0",
]

[project.optional-dependencies]
warehouse = [
    "psycopg2-binary>=2.9",
    "snowflake-connector-python>=3.12",
    "databricks-sql-connector>=3.4",
    "google-cloud-bigquery>=3.25",
]
deck = [
    "google-api-python-client>=2.140",
    "google-auth-oauthlib>=1.2",
]
llm = [
    "openai>=1.40",
]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["atlas"]
