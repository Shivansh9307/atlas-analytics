# Atlas pipeline DAG. The engine (atlas/dag.py) topologically sorts these nodes into
# execution tiers, runs each tier with bounded parallelism (max 3), applies per-node
# timeout + 1 retry, a circuit breaker, and graceful degradation for non-critical nodes.
#
# `atlas/orchestrator.py::SPECS` is the executable source of truth and MUST match this
# file. Edit both together when changing the graph.
#
# critical: true  -> a failure halts the run (no degraded deck).
# critical: false -> a failure is skipped; dependents that need it are skipped too.

nodes:
  profile:      { deps: [],                    critical: true,  timeout_s: 120, agent: source-profiler }
  frame:        { deps: [],                    critical: true,  timeout_s: 120, agent: requirements-analyst }
  semantics:    { deps: [frame, quality],      critical: true,  timeout_s: 120, agent: semantic-architect }  # also binds column roles, so it needs the clean layer
  quality:      { deps: [profile],             critical: true,  timeout_s: 180, agent: data-quality-copilot }  # detect->repair->clean layer
  readiness_gate: { deps: [quality, semantics], critical: true, timeout_s: 60,  agent: data-quality-copilot }  # Data Readiness Gate
  explore:      { deps: [profile, semantics, readiness_gate], critical: true, timeout_s: 240, agent: explorer }
  model:        { deps: [explore],             critical: true,  timeout_s: 600, agent: statistician }         # optional fit; no-op for aggregate playbooks
  diagnose:     { deps: [explore, model],      critical: true,  timeout_s: 240, agent: root-cause-analyst }
  redteam:      { deps: [explore, model],      critical: true,  timeout_s: 240, agent: red-team-validator }   # ‖ narrative
  sizing:       { deps: [diagnose],            critical: true,  timeout_s: 120, agent: opportunity-sizer }
  forecast:     { deps: [diagnose],            critical: false, timeout_s: 120, agent: forecaster }           # conditional enrichment
  cohort:       { deps: [diagnose],            critical: false, timeout_s: 120, agent: cohort-analyst }       # conditional enrichment
  narrative:    { deps: [sizing],              critical: true,  timeout_s: 180, agent: narrative-writer }
  deck:         { deps: [narrative, redteam],  critical: true,  timeout_s: 180, agent: deck-builder }         # blocked until redteam PASS
  emit:         { deps: [deck],                critical: false, timeout_s: 300, agent: deck-builder }         # extra exports; must not kill a validated run
  stakeholder:  { deps: [deck],                critical: false, timeout_s: 120, agent: stakeholder-simulator }
  retro:        { deps: [stakeholder, emit],   critical: false, timeout_s: 120, agent: retrospective-agent }

# experiment-designer is intentionally NOT in the default pipeline — designing a
# future A/B test is on-demand (/experiment), not part of explaining a past change.

# Resulting tiers (informational):
#   tier 0: profile, frame                    (parallel)
#   tier 1: quality                           (detect -> repair -> clean layer)
#   tier 2: semantics                         (resolve metric, pick playbook, bind columns)
#   tier 3: readiness_gate                    (Data Readiness Gate — blocks analysis on bad data)
#   tier 4: explore
#   tier 5: model                             (optional fit; clean no-op for aggregate playbooks)
#   tier 6: diagnose, redteam                 (parallel — red-team re-derives independently)
#   tier 7: sizing, forecast, cohort          (parallel — enrichment; forecast/cohort conditional)
#   tier 8: narrative
#   tier 9: deck
#   tier 10: emit, stakeholder                (parallel — extra exports ‖ exec-question check)
#   tier 11: retro

engine:
  max_concurrency: 3
  circuit_breaker: 3        # halt if this many nodes fail within one tier
  default_timeout_s: 300
  retries: 1
