# Atlas source registry. NO SECRETS HERE — creds referenced by env-var NAME only.
# A source becomes "live" when its adapter can connect (files: always; warehouses:
# once the referenced env vars are populated in .env).

sources:
  # --- LIVE: local fixture used by tests and the Phase 5 milestone ---
  emea_finance_csv:
    dialect: duckdb
    kind: file
    path: ./tests/fixtures/emea_margin.csv
    table_name: finance
    row_limit: 5000000
    access: mcp_or_driver:none   # local DuckDB, no MCP needed

