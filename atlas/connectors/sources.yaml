# Atlas source registry. NO SECRETS HERE — creds referenced by env-var NAME only.
# A source becomes "live" when its adapter can connect (files: always; warehouses:
# once the referenced env vars are populated in .env).

sources:
  # --- LIVE: local fixture used by tests and the Phase 5 milestone ---
  emea_finance_csv:
    dialect: duckdb
    kind: file
    path: ./tests/fixtures/emea_margin.csv
    table_name: finance
    row_limit: 5000000
    access: mcp_or_driver:none   # local DuckDB, no MCP needed

  # --- LIVE: generated churn fixture backing the descriptive/logistic playbook tests.
  # Deterministic (seeded); regenerated by tests/conftest.py on first run. Carries a
  # planted Payment Delay cliff at 16 and 21 so threshold detection has a known answer.
  churn_fixture:
    dialect: duckdb
    kind: file
    path: ./tests/fixtures/churn.csv
    table_name: churn
    row_limit: 5000000
    access: mcp_or_driver:none   # local DuckDB, no MCP needed

